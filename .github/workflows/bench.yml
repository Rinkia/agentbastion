name: Public benchmark

# Manual, informational only - NOT a gate. Fetches a public injection dataset
# over the network and reports the heuristic layer's real-world catch-rate.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "HuggingFace dataset id"
        default: "deepset/prompt-injections"
      split:
        description: "Split to evaluate"
        default: "test"

jobs:
  public-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench]"
      - run: |
          python benchmark/eval_public.py \
            --dataset "${{ inputs.dataset }}" \
            --split "${{ inputs.split }}"
