[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbastion"
version = "0.3.0"
description = "A firewall for AI agents: block prompt injection, guard tool calls, redact PII/secrets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefano Rizzello", email = "rizzellostefano@gmail.com" }]
keywords = ["llm", "security", "prompt-injection", "ai-agent", "pii", "guardrails", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Rinkia/agentbastion"
Repository = "https://github.com/Rinkia/agentbastion"
Issues = "https://github.com/Rinkia/agentbastion/issues"

[project.optional-dependencies]
# The LLM judge and the example agent need the Anthropic SDK. Core guards
# (heuristics, PII redaction, tool policy) run without it.
judge = ["anthropic>=1.0"]
# Deeper benchmark against public HuggingFace injection datasets (optional).
bench = ["datasets>=2.14"]
# HTTP gateway (hosted tier).
gateway = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "anthropic>=1.0", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
agentbastion-gateway = "agentbastion.gateway:_run"

[tool.setuptools.packages.find]
include = ["agentbastion*"]
